<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器 - 免费版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f5f1e8; color: #333; height: 100vh; overflow: hidden; }
        .topbar { background: #fff; padding: 15px 25px; display: flex; align-items: center; border-bottom: 1px solid #e0d8c8; height: 60px; }
        .topbar h1 { font-size: 20px; color: #8b6914; margin-right: 30px; }
        .topbar .btn { background: #8b6914; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        .topbar .btn:hover { background: #6b4f10; }
        .main { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 280px; background: #faf8f3; border-right: 1px solid #e0d8c8; padding: 20px 0; overflow-y: auto; }
        .sidebar-item { padding: 12px 25px; cursor: pointer; color: #666; display: flex; align-items: center; gap: 10px; }
        .sidebar-item:hover { background: #f0ebe0; }
        .sidebar-item.active { background: #f0ebe0; color: #8b6914; border-right: 3px solid #8b6914; font-weight: 500; }
        .sidebar-section { padding: 15px 25px; font-size: 12px; color: #999; text-transform: uppercase; margin-top: 10px; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .preview { width: 400px; background: #fff; border-left: 1px solid #e0d8c8; padding: 20px; overflow-y: auto; }
        .card { background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h2 { color: #8b6914; margin-bottom: 15px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 13px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #e0d8c8; border-radius: 6px; background: #faf8f3; color: #333; font-size: 14px; }
        textarea { height: 100px; resize: vertical; }
        .btn { background: #8b6914; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        .btn:hover { background: #6b4f10; }
        .btn.secondary { background: #e0d8c8; color: #333; }
        pre { background: #1e293b; color: #a5f3fc; padding: 15px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; font-size: 12px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>🔨 红色伪装 - Mod编辑器</h1>
        <button class="btn">导入mod文件</button>
        <button class="btn secondary">校验我的mod</button>
        <button class="btn" style="margin-left:auto;">导出mod (ZIP)</button>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-section">创作</div>
            <div class="sidebar-item active" onclick="showTab('focus')">🎯 国家焦点</div>
            <div class="sidebar-item" onclick="showTab('event')">📜 事件</div>
            <div class="sidebar-item" onclick="showTab('idea')">💡 理念</div>
            <div class="sidebar-item" onclick="showTab('politics')">🏛️ 政治与意识形态</div>
            <div class="sidebar-item" onclick="showTab('character')">👤 角色</div>
            <div class="sidebar-item" onclick="showTab('decision')">📋 决议</div>
            <div class="sidebar-section">完成</div>
            <div class="sidebar-item">✅ 校验我的mod</div>
            <div class="sidebar-item">⬇️ 导出mod (ZIP)</div>
        </div>
        <div class="content">
            <div id="focus" class="tab-content active">
                <div class="card">
                    <h2>国策树编辑</h2>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                        <div>
                            <div class="form-group">
                                <label>国策名字</label>
                                <input type="text" id="focusName" placeholder="例如 秘密会议">
                            </div>
                            <div class="form-group">
                                <label>国家TAG</label>
                                <select id="focusTag">
                                    <option value="SSF">苏维埃社会主义联邦 SSF</option>
                                    <option value="GER">德国 GER</option>
                                    <option value="USA">美国 USA</option>
                                    <option value="CHI">中国 CHI</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>成本（天）</label>
                                <input type="number" id="focusCost" value="10">
                            </div>
                            <div class="form-group">
                                <label>效果（选效果点添加）</label>
                                <select id="effectSelect">
                                    <option value="">-- 选择效果 --</option>
                                    <option value="political_power = 150">+150政治点</option>
                                    <option value="stability_factor = 0.1">+10%稳定度</option>
                                    <option value="war_support = 0.1">+10%战争支持</option>
                                </select>
                                <button class="btn secondary" style="margin-top:10px;" onclick="addEffect()">添加效果</button>
                            </div>
                            <button class="btn" onclick="addFocus()">添加国策</button>
                        </div>
                        <div>
                            <label>效果代码</label>
                            <textarea id="focusEffect" style="height:200px;"></textarea>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h2>已添加的国策</h2>
                    <div id="focusList"></div>
                </div>
            </div>

            <div id="event" class="tab-content" style="display:none;">
                <div class="card">
                    <h2>事件编辑</h2>
                    <p>事件是玩家撞见你故事的瞬间，弹窗、抉择、转折点。</p>
                </div>
            </div>

            <div id="idea" class="tab-content" style="display:none;">
                <div class="card">
                    <h2>理念编辑</h2>
                    <p>国家精神，是你国家的性格，开局的buff与包袱。</p>
                </div>
            </div>

            <div id="politics" class="tab-content" style="display:none;">
                <div class="card">
                    <h2>国家政治</h2>
                    <p>设置各意识形态支持率、执政意识形态和选举规则。</p>
                </div>
            </div>

            <div id="character" class="tab-content" style="display:none;">
                <div class="card">
                    <h2>角色编辑</h2>
                    <p>给你的国家一张脸，领袖、将军、大臣。</p>
                </div>
            </div>

            <div id="decision" class="tab-content" style="display:none;">
                <div class="card">
                    <h2>决议编辑</h2>
                    <p>决议是玩家主动出手的地方，限时行动、持续项目、国家任务。</p>
                </div>
            </div>
        </div>
        <div class="preview">
            <h2 style="color:#8b6914; margin-bottom:15px;">实时预览</h2>
            <div style="background:#1a1a2e; border-radius:8px; padding:20px; color:#fff; text-align:center;">
                <p style="color:#999; margin-top:50px;">在这里预览游戏内效果</p>
            </div>
            <div style="margin-top:20px;">
                <button class="btn" style="width:100%;">在游戏里查看</button>
            </div>
        </div>
    </div>

    <script>
        let focuses = [];

        function showTab(tab) {
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
        }

        function addEffect() {
            const effect = document.getElementById('effectSelect').value;
            if (!effect) return;
            const old = document.getElementById('focusEffect').value;
            document.getElementById('focusEffect').value = old + (old ? '\n' : '') + effect;
        }

        function addFocus() {
            const name = document.getElementById('focusName').value.trim();
            const tag = document.getElementById('focusTag').value;
            const cost = document.getElementById('focusCost').value;
            const effect = document.getElementById('focusEffect').value.trim();
            if (!name) { alert('请输入国策名字'); return; }
            const id = tag + '_' + name.replace(/\s+/g, '_').toLowerCase();
            focuses.push({ id, name, tag, cost, effect });
            document.getElementById('focusList').innerHTML += `<div style="padding:10px; background:#faf8f3; border-radius:6px; margin-bottom:8px;">${name} (${id})</div>`;
            alert('国策添加成功！');
        }
    </script>
</body>
</html>
