<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f5f1e8; color: #333; height: 100vh; overflow: hidden; }
        .topbar { background: #fff; padding: 12px 20px; display: flex; align-items: center; border-bottom: 1px solid #e0d8c8; height: 60px; }
        .topbar h1 { font-size: 18px; color: #5c3a0e; }
        .btn { background: #5c3a0e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 14px; }
        .btn.sec { background: #e0d8c8; color: #333; }
        .btn.danger { background: #e74c3c; padding: 4px 8px; font-size: 12px; }
        .page { padding: 25px; height: calc(100vh - 60px); overflow-y: auto; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat { background: #fff; padding: 20px; border-radius: 12px; }
        .stat .l { color: #999; font-size: 13px; margin-bottom: 8px; }
        .stat .v { font-size: 28px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; cursor: pointer; position: relative; min-height:150px; }
        .card .n { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .card .t { color: #5c3a0e; font-size: 13px; margin-bottom: 12px; }
        .new { border: 2px dashed #d0c8b8; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; }
        .editor { display: none; height: 100vh; flex-direction: column; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .side { width: 250px; background: #faf8f3; border-right: 1px solid #e0d8c8; padding: 15px 0; overflow-y: auto; flex-shrink: 0; }
        .side .item { padding: 10px 20px; cursor: pointer; color: #666; font-size: 14px; }
        .side .item.on { background: #f0ebe0; color: #5c3a0e; border-right: 3px solid #5c3a0e; font-weight: bold; }
        .side .sec { padding: 12px 20px; font-size: 11px; color: #999; margin-top: 8px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; min-width: 0; }
        .form { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 12px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #e0d8c8; border-radius: 6px; background: #faf8f3; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .list-item { padding: 10px; background: #faf8f3; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #5c3a0e; }
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2,1fr); }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="home">
        <div class="topbar">
            <h1>HOI4 Mod 编辑器</h1>
        </div>
        <div class="page">
            <h2 style="margin-bottom:20px;">我的项目</h2>
            <div class="stats">
                <div class="stat"><div class="l">项目数</div><div class="v" id="statProj">1</div></div>
                <div class="stat"><div class="l">国家数</div><div class="v">1</div></div>
                <div class="stat"><div class="l">实体数</div><div class="v" id="statEnt">0</div></div>
                <div class="stat"><div class="l">存储</div><div class="v" style="font-size:16px;">本地存储</div></div>
            </div>
            <div class="grid" id="projGrid"></div>
        </div>
    </div>

    <div id="ed" class="editor">
        <div class="topbar">
            <h1 id="edTitle">项目</h1>
            <button class="btn sec" id="backBtn" style="margin-left:auto;">返回首页</button>
        </div>
        <div class="main">
            <div class="side" id="side">
                <div class="item on" data-tab="ai">AI助手</div>
                <div class="item" data-tab="country">国家基础</div>
                <div class="sec">创作</div>
                <div class="item" data-tab="char">角色</div>
                <div class="item" data-tab="focus">国策树</div>
                <div class="item" data-tab="event">事件</div>
                <div class="sec">系统</div>
                <div class="item" data-tab="settings">设置</div>
            </div>
            <div class="content">
                <div id="ai" class="tab">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">AI助手</h3>
                        <textarea id="chatInput" placeholder="输入世界观，一键生成内容" style="height:100px;"></textarea>
                        <br><br>
                        <button class="btn" id="sendChatBtn">发送</button>
                    </div>
                </div>
                <div id="country" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">国家设置</h3>
                        <div class="form"><label>国家TAG</label><input id="ctag" value="SSF"></div>
                        <div class="form"><label>国家名</label><input id="cname" value="苏维埃社会主义联邦"></div>
                    </div>
                </div>
                <div id="char" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">角色</h3>
                        <div class="form"><label>角色名</label><input id="charname"></div>
                        <button class="btn" id="addCharBtn">+ 添加</button>
                    </div>
                    <div id="charlist" style="margin-top:15px;"></div>
                </div>
                <div id="focus" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">国策</h3>
                        <div class="form"><label>国策名</label><input id="focusname"></div>
                        <button class="btn" id="addFocusBtn">+ 添加</button>
                    </div>
                    <div id="focuslist" style="margin-top:15px;"></div>
                </div>
                <div id="event" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">事件</h3>
                        <div class="form"><label>事件标题</label><input id="evtitle"></div>
                        <button class="btn" id="addEventBtn">+ 添加</button>
                    </div>
                    <div id="eventlist" style="margin-top:15px;"></div>
                </div>
                <div id="settings" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">设置</h3>
                        <div class="form"><label>自定义API Key（可选）</label><input id="setApiKey" type="password" placeholder="sk-..."></div>
                        <div class="form"><label>API地址</label><input id="setApiUrl" placeholder="https://api.deepseek.com/v1/chat/completions"></div>
                        <button class="btn" id="saveSettingsBtn">保存设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let projects = [];
        let cur = null;
        try { projects = JSON.parse(localStorage.getItem('hoi_proj_safe') || '[]'); } catch(e) { projects = []; }
        if (!projects.length) {
            projects = [{id:'p1', name:'红色伪装', data:{tag:'SSF', cname:'苏维埃社会主义联邦', chars:[{name:'斯大林'}], focuses:[{name:'翻牌联合国', cost:70}], events:[{title:'联合国大会'}]}}];
            localStorage.setItem('hoi_proj_safe', JSON.stringify(projects));
        }
        function renderhome() {
            document.getElementById('statProj').textContent = projects.length;
            const g = document.getElementById('projGrid');
            g.innerHTML = '';
            projects.forEach((p, idx) => {
                const d = document.createElement('div');
                d.className = 'card';
                d.innerHTML = '<div class="n">'+p.name+'</div><div class="t">'+p.data.tag+'</div>';
                d.onclick = () => open(p.id);
                g.appendChild(d);
            });
            const nc = document.createElement('div');
            nc.className = 'card new';
            nc.textContent = '+ 新建项目';
            nc.onclick = () => {
                const n = prompt('输入项目名：');
                const tag = prompt('输入3字母国家TAG：').toUpperCase();
                if (n && tag) {
                    projects.push({id:'p'+Date.now(), name:n, data:{tag:tag, cname:n, chars:[], focuses:[], events:[]}});
                    localStorage.setItem('hoi_proj_safe', JSON.stringify(projects));
                    renderhome();
                }
            };
            g.appendChild(nc);
            const ic = document.createElement('div');
            ic.className = 'card new';
            ic.textContent = '导入mod ZIP';
            g.appendChild(ic);
        }
        function open(id) {
            cur = projects.find(p=>p.id==id);
            document.getElementById('edTitle').textContent = cur.name;
            document.getElementById('home').style.display='none';
            document.getElementById('ed').style.display='flex';
        }
        document.getElementById('backBtn').onclick = () => { document.getElementById('ed').style.display='none'; document.getElementById('home').style.display='block'; renderhome(); };
        document.querySelectorAll('.item').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.item').forEach(i=>i.classList.remove('on'));
                item.classList.add('on');
                document.querySelectorAll('.tab').forEach(t2=>t2.style.display='none');
                document.getElementById(item.dataset.tab).style.display='block';
            };
        });
        renderhome();
    </script>
</body>
</html>
