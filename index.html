<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器 - 免费版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1e293b; color: #e2e8f0; }
        .header { background: #0f172a; padding: 15px 30px; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 20px; color: #38bdf8; }
        .tabs { background: #1e293b; padding: 0 30px; display: flex; gap: 5px; border-bottom: 1px solid #334155; }
        .tab { padding: 12px 24px; cursor: pointer; border: none; background: transparent; color: #94a3b8; font-size: 14px; }
        .tab.active { background: #0f172a; color: #38bdf8; border-bottom: 2px solid #38bdf8; }
        .panel { display: none; padding: 30px; }
        .panel.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .box h2 { margin-bottom: 15px; color: #38bdf8; font-size: 16px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-size: 14px; }
        textarea { height: 100px; resize: vertical; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; margin-right: 10px; margin-bottom: 10px; }
        button:hover { background: #0ea5e9; }
        button.secondary { background: #334155; color: #e2e8f0; }
        pre { background: #0f172a; padding: 15px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: #a5f3fc; border: 1px solid #334155; }
        .item { background: #1e293b; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="header">
        <h1>HOI4 Mod 编辑器 - 免费版</h1>
    </div>
    <div class="tabs">
        <button class="tab active" onclick="showTab('focus')">国策树</button>
        <button class="tab" onclick="showTab('event')">事件</button>
        <button class="tab" onclick="showTab('idea')">理念</button>
        <button class="tab" onclick="showTab('loc')">本地化</button>
    </div>

    <!-- 国策树 -->
    <div id="focus" class="panel active">
        <div class="grid">
            <div class="box">
                <h2>添加国策</h2>
                <div class="form-group">
                    <label>国策ID</label>
                    <input type="text" id="focusId" placeholder="例如 SOV_red_camouflage_1">
                </div>
                <div class="form-group">
                    <label>国策名字</label>
                    <input type="text" id="focusName" placeholder="例如 秘密会议">
                </div>
                <div class="form-group">
                    <label>成本（天）</label>
                    <input type="number" id="focusCost" value="10">
                </div>
                <div class="form-group">
                    <label>前置国策ID（可选）</label>
                    <input type="text" id="focusPrereq" placeholder="前置国策的ID">
                </div>
                <div class="form-group">
                    <label>效果（每行一条）</label>
                    <textarea id="focusEffect" placeholder="例如 political_power = 150"></textarea>
                </div>
                <button onclick="addFocus()">添加国策</button>
                <button class="secondary" onclick="downloadCode('focus')">下载国策文件</button>
                <h2 style="margin-top:20px;">已添加的国策</h2>
                <div id="focusList"></div>
            </div>
            <div class="box">
                <h2>生成的代码</h2>
                <pre id="focusCode">// 生成的国策树代码会显示在这里</pre>
            </div>
        </div>
    </div>

    <!-- 事件 -->
    <div id="event" class="panel">
        <div class="grid">
            <div class="box">
                <h2>添加事件</h2>
                <div class="form-group">
                    <label>事件ID</label>
                    <input type="text" id="eventId" placeholder="例如 SOV_red_camouflage.1">
                </div>
                <div class="form-group">
                    <label>事件标题</label>
                    <input type="text" id="eventTitle" placeholder="例如 联合国大会">
                </div>
                <div class="form-group">
                    <label>事件描述</label>
                    <textarea id="eventDesc" placeholder="输入事件描述..."></textarea>
                </div>
                <div class="form-group">
                    <label>选项1文字</label>
                    <input type="text" id="eventOpt1" placeholder="例如 同志们，我们回来了">
                </div>
                <div class="form-group">
                    <label>选项1效果（每行一条）</label>
                    <textarea id="eventEffect1" placeholder="例如 political_power = 500"></textarea>
                </div>
                <button onclick="addEvent()">添加事件</button>
                <button class="secondary" onclick="downloadCode('event')">下载事件文件</button>
                <h2 style="margin-top:20px;">已添加的事件</h2>
                <div id="eventList"></div>
            </div>
            <div class="box">
                <h2>生成的代码</h2>
                <pre id="eventCode">// 生成的事件代码会显示在这里</pre>
            </div>
        </div>
    </div>

    <!-- 理念 -->
    <div id="idea" class="panel">
        <div class="grid">
            <div class="box">
                <h2>添加理念</h2>
                <div class="form-group">
                    <label>理念ID</label>
                    <input type="text" id="ideaId" placeholder="例如 SOV_red_camouflage_idea">
                </div>
                <div class="form-group">
                    <label>理念名字</label>
                    <input type="text" id="ideaName" placeholder="例如 苏联重生">
                </div>
                <div class="form-group">
                    <label>理念描述</label>
                    <textarea id="ideaDesc" placeholder="输入理念描述..."></textarea>
                </div>
                <div class="form-group">
                    <label>修正（每行一条）</label>
                    <textarea id="ideaMod" placeholder="例如 stability_factor = 0.1"></textarea>
                </div>
                <button onclick="addIdea()">添加理念</button>
                <button class="secondary" onclick="downloadCode('idea')">下载理念文件</button>
                <h2 style="margin-top:20px;">已添加的理念</h2>
                <div id="ideaList"></div>
            </div>
            <div class="box">
                <h2>生成的代码</h2>
                <pre id="ideaCode">// 生成的理念代码会显示在这里</pre>
            </div>
        </div>
    </div>

    <!-- 本地化 -->
    <div id="loc" class="panel">
        <div class="grid">
            <div class="box">
                <h2>添加本地化</h2>
                <div class="form-group">
                    <label>键名</label>
                    <input type="text" id="locKey" placeholder="例如 SOV_red_camouflage_1">
                </div>
                <div class="form-group">
                    <label>中文内容</label>
                    <input type="text" id="locValue" placeholder="例如 秘密会议">
                </div>
                <button onclick="addLoc()">添加本地化</button>
                <button class="secondary" onclick="downloadCode('loc')">下载本地化文件</button>
                <h2 style="margin-top:20px;">已添加的本地化</h2>
                <div id="locList"></div>
            </div>
            <div class="box">
                <h2>生成的代码</h2>
                <pre id="locCode"># 红色伪装 mod - 本地化文件
l_simp_chinese:</pre>
            </div>
        </div>
    </div>

    <script>
        let focuses = [];
        let events = [];
        let ideas = [];
        let locs = [];

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        // 国策树
        function addFocus() {
            const id = document.getElementById('focusId').value.trim();
            const name = document.getElementById('focusName').value.trim();
            const cost = document.getElementById('focusCost').value;
            const prereq = document.getElementById('focusPrereq').value.trim();
            const effect = document.getElementById('focusEffect').value.trim();
            if (!id || !name) { alert('请填写国策ID和名字'); return; }
            focuses.push({ id, name, cost, prereq, effect });
            document.getElementById('focusList').innerHTML += `<div class="item">${name} (${id})</div>`;
            genFocusCode();
        }
        function genFocusCode() {
            let code = 'focus_tree = {\n';
            code += '\tname = "Custom_Focus_Tree"\n';
            code += '\tcountry = { factor = 1 }\n';
            code += '\tdefault = no\n\n';
            focuses.forEach((f, i) => {
                code += `\tfocus = {\n`;
                code += `\t\tid = ${f.id}\n`;
                code += `\t\ticon = generic_intelligence\n`;
                if (f.prereq) code += `\t\tprerequisite = { focus = ${f.prereq} }\n`;
                code += `\t\tx = 0\n\t\ty = ${i}\n\t\tcost = ${f.cost}\n`;
                code += `\t\tcompletion_reward = {\n`;
                if (f.effect) f.effect.split('\n').forEach(e => code += `\t\t\t${e}\n`);
                code += `\t\t}\n\t}\n\n`;
            });
            code += '}';
            document.getElementById('focusCode').textContent = code;
        }

        // 事件
        function addEvent() {
            const id = document.getElementById('eventId').value.trim();
            const title = document.getElementById('eventTitle').value.trim();
            const desc = document.getElementById('eventDesc').value.trim();
            const opt1 = document.getElementById('eventOpt1').value.trim();
            const effect1 = document.getElementById('eventEffect1').value.trim();
            if (!id || !title) { alert('请填写事件ID和标题'); return; }
            events.push({ id, title, desc, opt1, effect1 });
            document.getElementById('eventList').innerHTML += `<div class="item">${title} (${id})</div>`;
            genEventCode();
        }
        function genEventCode() {
            let code = '';
            events.forEach(e => {
                code += `country_event = {\n`;
                code += `\tid = ${e.id}\n\ttitle = "${e.title}"\n\tdesc = "${e.desc}"\n`;
                code += `\tpicture = GFX_goal_generic_american_assembly\n\tis_triggered_only = yes\n`;
                code += `\toption = {\n\t\tname = "${e.opt1}"\n`;
                if (e.effect1) e.effect1.split('\n').forEach(ef => code += `\t\t${ef}\n`);
                code += `\t}\n}\n\n`;
            });
            document.getElementById('eventCode').textContent = code;
        }

        // 理念
        function addIdea() {
            const id = document.getElementById('ideaId').value.trim();
            const name = document.getElementById('ideaName').value.trim();
            const desc = document.getElementById('ideaDesc').value.trim();
            const mod = document.getElementById('ideaMod').value.trim();
            if (!id || !name) { alert('请填写理念ID和名字'); return; }
            ideas.push({ id, name, desc, mod });
            document.getElementById('ideaList').innerHTML += `<div class="item">${name} (${id})</div>`;
            genIdeaCode();
        }
        function genIdeaCode() {
            let code = 'ideas = {\n\tcountry = {\n';
            ideas.forEach(i => {
                code += `\t\t${i.id} = {\n\t\t\tpicture = generic_intelligence\n\t\t\t\n`;
                if (i.mod) i.mod.split('\n').forEach(m => code += `\t\t\t${m}\n`);
                code += `\t\t}\n`;
            });
            code += '\t}\n}';
            document.getElementById('ideaCode').textContent = code;
        }

        // 本地化
        function addLoc() {
            const key = document.getElementById('locKey').value.trim();
            const value = document.getElementById('locValue').value.trim();
            if (!key || !value) { alert('请填写键名和内容'); return; }
            locs.push({ key, value });
            document.getElementById('locList').innerHTML += `<div class="item">${key}: ${value}</div>`;
            genLocCode();
        }
        function genLocCode() {
            let code = '# 红色伪装 mod - 本地化文件\nl_simp_chinese:\n';
            locs.forEach(l => code += `\t${l.key}:0 "${l.value}"\n`);
            document.getElementById('locCode').textContent = code;
        }

        function downloadCode(type) {
            let code = '';
            let filename = '';
            if (type === 'focus') { code = document.getElementById('focusCode').textContent; filename = 'focus_tree.txt'; }
            if (type === 'event') { code = document.getElementById('eventCode').textContent; filename = 'events.txt'; }
            if (type === 'idea') { code = document.getElementById('ideaCode').textContent; filename = 'ideas.txt'; }
            if (type === 'loc') { code = document.getElementById('locCode').textContent; filename = 'localisation_l_chinese.yml'; }
            const blob = new Blob([code], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }
    </script>
</body>
</html>
