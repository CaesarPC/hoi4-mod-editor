<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f5f1e8; height: 100vh; overflow: hidden; }
        .topbar { background: #fff; padding: 12px 20px; display: flex; align-items: center; border-bottom: 1px solid #e0d8c8; height: 60px; }
        .topbar h1 { font-size: 18px; color: #5c3a0e; margin-right: 20px; }
        .menu-btn { display: none; background: #5c3a0e; color: white; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; margin-right: 15px; }
        .btn { background: #5c3a0e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 14px; }
        .btn.sec { background: #e0d8c8; color: #333; }
        .btn.danger { background: #e74c3c; padding: 4px 8px; font-size: 12px; }
        .page { padding: 25px; height: calc(100vh - 60px); overflow-y: auto; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat { background: #fff; padding: 20px; border-radius: 12px; }
        .stat .l { color: #999; font-size: 13px; margin-bottom: 8px; }
        .stat .v { font-size: 28px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; cursor: pointer; position: relative; }
        .card .n { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .card .t { color: #5c3a0e; font-size: 13px; margin-bottom: 12px; }
        .new { border: 2px dashed #d0c8b8; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; color: #999; cursor: pointer; }
        .editor { display: none; height: 100vh; flex-direction: column; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .side { width: 250px; background: #faf8f3; border-right: 1px solid #e0d8c8; padding: 15px 0; overflow-y: auto; flex-shrink: 0; }
        .side .item { padding: 10px 20px; cursor: pointer; color: #666; font-size: 14px; }
        .side .item.on { background: #f0ebe0; color: #5c3a0e; border-right: 3px solid #5c3a0e; font-weight: bold; }
        .side .sec { padding: 12px 20px; font-size: 11px; color: #999; margin-top: 8px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .form { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 12px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #e0d8c8; border-radius: 6px; background: #faf8f3; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .list-item { padding: 10px; background: #faf8f3; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #5c3a0e; }
        .ov { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 99; }
        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .side { position: fixed; top: 60px; left: 0; bottom: 0; z-index: 100; transform: translateX(-100%); width: 270px; }
            .side.open { transform: translateX(0); }
            .ov.open { display: block; }
            .stats { grid-template-columns: repeat(2,1fr); }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="home">
        <div class="topbar">
            <button class="menu-btn" onclick="toggleside()">☰</button>
            <h1>HOI4 Mod 编辑器</h1>
        </div>
        <div class="page">
            <h2 style="margin-bottom:20px;">我的项目</h2>
            <div class="stats">
                <div class="stat"><div class="l">项目数</div><div class="v" id="statProj">1</div></div>
                <div class="stat"><div class="l">国家数</div><div class="v" id="statCountry">1</div></div>
                <div class="stat"><div class="l">实体数</div><div class="v" id="statEnt">0</div></div>
                <div class="stat"><div class="l">存储</div><div class="v" style="font-size:16px;">浏览器本地存储</div></div>
            </div>
            <div class="grid" id="projGrid"></div>
        </div>
    </div>

    <div id="ed" class="editor">
        <div class="topbar">
            <button class="menu-btn" onclick="toggleside()">☰</button>
            <h1 id="edTitle">项目</h1>
            <button class="btn sec" style="margin-left:auto;" onclick="gohome()">返回首页</button>
            <button class="btn" onclick="exportZip()">导出ZIP</button>
        </div>
        <div class="ov" id="ov" onclick="toggleside()"></div>
        <div class="main">
            <div class="side" id="side">
                <div class="item on" onclick="showtab('ai',this)">AI一键生成</div>
                <div class="item" onclick="showtab('country',this)">国家基础</div>
                <div class="sec">创作</div>
                <div class="item" onclick="showtab('char',this)">角色</div>
                <div class="item" onclick="showtab('pol',this)">政治</div>
                <div class="item" onclick="showtab('idea',this)">国家精神</div>
                <div class="item" onclick="showtab('focus',this)">国策树</div>
                <div class="item" onclick="showtab('event',this)">事件</div>
                <div class="item" onclick="showtab('dec',this)">决议</div>
            </div>
            <div class="content">
                <div id="ai" class="tab">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">AI快速生成</h3>
                        <textarea id="aiprompt" style="height:100px;" placeholder="输入你的mod世界观，一键生成起步内容"></textarea>
                        <br><br>
                        <button class="btn" onclick="aigen()">一键生成起步包</button>
                    </div>
                </div>
                <div id="country" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">国家设置</h3>
                        <div class="form"><label>国家TAG（3字母）</label><input id="ctag" value="SSF"></div>
                        <div class="form"><label>国家名</label><input id="cname" value="苏维埃社会主义联邦"></div>
                        <button class="btn" onclick="savecountry()">保存</button>
                    </div>
                </div>
                <div id="char" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加角色</h3>
                        <div class="form"><label>名字</label><input id="charname" placeholder="角色名"></div>
                        <div class="form"><label>类型</label><select id="chartype"><option>国家领袖</option><option>将军</option><option>顾问</option></select></div>
                        <button class="btn" onclick="addchar()">+ 添加</button>
                    </div>
                    <div id="charlist" style="margin-top:15px;"></div>
                </div>
                <div id="pol" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">政治支持率</h3>
                        <div class="form"><label>共产主义%</label><input id="supcom" value="80"></div>
                        <div class="form"><label>民主主义%</label><input id="supdem" value="5"></div>
                        <button class="btn" onclick="savepol()">保存</button>
                    </div>
                </div>
                <div id="idea" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加国家精神</h3>
                        <div class="form"><label>名字</label><input id="ideaname" placeholder="精神名"></div>
                        <button class="btn" onclick="addidea()">+ 添加</button>
                    </div>
                    <div id="idealist" style="margin-top:15px;"></div>
                </div>
                <div id="focus" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加国策</h3>
                        <div class="form"><label>国策名</label><input id="focusname" placeholder="国策名"></div>
                        <div class="form"><label>耗时天数</label><input id="focuscost" value="70"></div>
                        <button class="btn" onclick="addfocus()">+ 添加</button>
                    </div>
                    <div id="focuslist" style="margin-top:15px;"></div>
                </div>
                <div id="event" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加事件</h3>
                        <div class="form"><label>标题</label><input id="evtitle" placeholder="事件标题"></div>
                        <div class="form"><label>描述</label><textarea id="evdesc"></textarea></div>
                        <button class="btn" onclick="addevent()">+ 添加事件</button>
                    </div>
                    <div id="eventlist" style="margin-top:15px;"></div>
                </div>
                <div id="dec" class="tab" style="display:none;">
                    <div class="card" style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加决议</h3>
                        <div class="form"><label>名字</label><input id="decname" placeholder="决议名"></div>
                        <button class="btn" onclick="adddec()">+ 添加决议</button>
                    </div>
                    <div id="declist" style="margin-top:15px;"></div>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="impfile" accept=".zip" style="display:none">

    <script>
        let projects = [];
        let cur = null;
        function load() {
            const s = localStorage.getItem('hoi_proj');
            if (s) projects = JSON.parse(s);
            if (!projects.length) {
                projects = [{id:'p1', name:'红色伪装', data:{tag:'SSF', cname:'苏维埃社会主义联邦', chars:[], ideas:[], focuses:[], events:[], decs:[]}}];
                save();
            }
            renderhome();
        }
        function save() { localStorage.setItem('hoi_proj', JSON.stringify(projects)); renderhome(); }
        function renderhome() {
            document.getElementById('statProj').textContent = projects.length;
            const g = document.getElementById('projGrid');
            g.innerHTML = '';
            projects.forEach((p, idx) => {
                const d = document.createElement('div');
                d.className = 'card';
                d.innerHTML = '<button class="btn danger" style="position:absolute;top:10px;right:10px;">删除</button><div class="n">'+p.name+'</div><div class="t">'+p.data.tag+'</div>';
                d.querySelector('.danger').onclick = (e) => { e.stopPropagation(); delp(idx); };
                d.onclick = () => open(p.id);
                g.appendChild(d);
            });
            const nc = document.createElement('div');
            nc.className = 'card new';
            nc.textContent = '+ 新建项目';
            nc.onclick = newp;
            g.appendChild(nc);
            const ic = document.createElement('div');
            ic.className = 'card new';
            ic.textContent = '导入mod ZIP';
            ic.onclick = () => document.getElementById('impfile').click();
            g.appendChild(ic);
        }
        function delp(idx) { if(confirm('删除这个项目？')) { projects.splice(idx,1); save(); } }
        function newp() { const n = prompt('项目名'); if(n) { projects.push({id:'p'+Date.now(), name:n, data:{tag:'XXX', cname:n, chars:[], ideas:[], focuses:[], events:[], decs:[]}}); save(); open(projects[projects.length-1].id); } }
        function open(id) {
            cur = projects.find(p=>p.id==id);
            document.getElementById('edTitle').textContent = cur.name;
            document.getElementById('home').style.display='none';
            document.getElementById('ed').style.display='flex';
            document.getElementById('ctag').value = cur.data.tag;
            document.getElementById('cname').value = cur.data.cname;
            renderall();
        }
        function gohome() { document.getElementById('ed').style.display='none'; document.getElementById('home').style.display='block'; save(); }
        function toggleside() { document.getElementById('side').classList.toggle('open'); document.getElementById('ov').classList.toggle('open'); }
        function showtab(t, el) { document.querySelectorAll('.item').forEach(i=>i.classList.remove('on')); el.classList.add('on'); document.querySelectorAll('.tab').forEach(t2=>t2.style.display='none'); document.getElementById(t).style.display='block'; if(innerWidth<768) toggleside(); }
        function savecountry() { cur.data.tag = document.getElementById('ctag').value.toUpperCase(); cur.data.cname = document.getElementById('cname').value; save(); alert('保存成功'); }
        function savepol() { alert('政治设置已保存'); }
        function addchar() { const n = document.getElementById('charname').value.trim(); if(!n) return; cur.data.chars.push({name:n}); renderall(); save(); }
        function addidea() { const n = document.getElementById('ideaname').value.trim(); if(!n) return; cur.data.ideas.push({name:n}); renderall(); save(); }
        function addfocus() { const n = document.getElementById('focusname').value.trim(); const c = document.getElementById('focuscost').value; if(!n) return; cur.data.focuses.push({name:n, cost:c}); renderall(); save(); }
        function addevent() { const t = document.getElementById('evtitle').value.trim(); if(!t) return; cur.data.events.push({title:t}); renderall(); save(); }
        function adddec() { const n = document.getElementById('decname').value.trim(); if(!n) return; cur.data.decs.push({name:n}); renderall(); save(); }
        function rendlist(id, arr, delfn) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            arr.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = '<span>'+Object.values(item)[0]+'</span>';
                const btn = document.createElement('button');
                btn.className = 'btn danger';
                btn.textContent = '删除';
                btn.onclick = () => window[delfn](i);
                div.appendChild(btn);
                el.appendChild(div);
            });
        }
        function renderall() {
            rendlist('charlist', cur.data.chars, 'delchar');
            rendlist('idealist', cur.data.ideas, 'delidea');
            rendlist('focuslist', cur.data.focuses, 'delfocus');
            rendlist('eventlist', cur.data.events, 'delevent');
            rendlist('declist', cur.data.decs, 'deldec');
        }
        function delchar(i) { cur.data.chars.splice(i,1); renderall(); save(); }
        function delidea(i) { cur.data.ideas.splice(i,1); renderall(); save(); }
        function delfocus(i) { cur.data.focuses.splice(i,1); renderall(); save(); }
        function delevent(i) { cur.data.events.splice(i,1); renderall(); save(); }
        function deldec(i) { cur.data.decs.splice(i,1); renderall(); save(); }
        function aigen() { cur.data.chars.push({name:'领袖'}); cur.data.ideas.push({name:'建国团结'}); cur.data.focuses.push({name:'巩固政权', cost:70}); cur.data.events.push({title:'建国公告'}); renderall(); save(); alert('生成完成！已加1领袖+1精神+1国策+1事件'); }
        function exportZip() {
            const zip = new JSZip();
            zip.file('descriptor.mod', 'version="1.0.0"\nname="'+cur.name+'"\n');
            zip.folder('common/country_tags').file('00.txt', cur.data.tag + ' = "' + cur.data.cname + '"');
            zip.generateAsync({type:'blob'}).then(c => saveAs(c, cur.name+'.zip'));
            alert('导出成功！');
        }
        load();
    </script>
</body>
</html>
