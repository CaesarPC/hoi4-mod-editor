<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器 - 免费版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #2d2d3d; color: #fff; height: 100vh; overflow: hidden; }
        .toolbar { background: #1e1e2e; padding: 10px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #3d3d4d; }
        .toolbar button { background: #4a9eff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .toolbar button:hover { background: #3a8eef; }
        .main { display: flex; height: calc(100vh - 50px); }
        .sidebar { width: 300px; background: #252535; padding: 15px; overflow-y: auto; border-right: 1px solid #3d3d4d; }
        .canvas { flex: 1; background: #1a1a2e; position: relative; overflow: auto; background-image: radial-gradient(circle, #333 1px, transparent 1px); background-size: 20px 20px; }
        .focus-node { position: absolute; width: 120px; height: 60px; background: #4a9eff; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: move; padding: 5px; font-size: 12px; }
        .focus-node:hover { background: #5aafff; }
        .panel { width: 350px; background: #252535; padding: 15px; overflow-y: auto; border-left: 1px solid #3d3d4d; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
        input, textarea { width: 100%; padding: 8px; border: none; border-radius: 4px; background: #1a1a2e; color: #fff; font-size: 13px; }
        textarea { height: 80px; resize: vertical; }
        h2 { margin-bottom: 15px; color: #4a9eff; font-size: 16px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1 style="font-size:18px; margin-right:30px;">HOI4 Mod 编辑器</h1>
        <button onclick="addFocusNode()">+ 添加国策</button>
        <button onclick="generateCode()">生成代码</button>
        <button onclick="downloadCode()">下载 .txt</button>
        <span style="margin-left:auto; color:#aaa; font-size:12px;">免费开源，无付费墙</span>
    </div>
    <div class="main">
        <div class="sidebar">
            <h2>国策列表</h2>
            <div id="focusList"></div>
        </div>
        <div class="canvas" id="canvas">
            <div class="focus-node" style="left:100px; top:100px;" onclick="selectNode(this)">秘密会议</div>
        </div>
        <div class="panel">
            <h2>编辑国策</h2>
            <div class="form-group">
                <label>国策ID</label>
                <input type="text" id="editId" value="SOV_red_camouflage_1">
            </div>
            <div class="form-group">
                <label>国策名字</label>
                <input type="text" id="editName" value="秘密会议">
            </div>
            <div class="form-group">
                <label>成本（天）</label>
                <input type="number" id="editCost" value="10">
            </div>
            <div class="form-group">
                <label>效果（每行一条）</label>
                <textarea id="editEffect">political_power = 150</textarea>
            </div>
            <button onclick="saveNode()">保存修改</button>
        </div>
    </div>

    <script>
        let selectedNode = null;
        let focuses = [
            { id: 'SOV_red_camouflage_1', name: '秘密会议', cost: 10, effect: 'political_power = 150', x: 100, y: 100 }
        ];

        function addFocusNode() {
            const id = prompt('国策ID：');
            const name = prompt('国策名字：');
            if (!id || !name) return;
            focuses.push({ id, name, cost: 10, effect: '', x: Math.random()*400+50, y: Math.random()*300+50 });
            renderCanvas();
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            focuses.forEach(f => {
                const node = document.createElement('div');
                node.className = 'focus-node';
                node.style.left = f.x + 'px';
                node.style.top = f.y + 'px';
                node.textContent = f.name;
                node.onclick = () => selectNode(node, f);
                canvas.appendChild(node);
            });
            renderList();
        }

        function renderList() {
            const list = document.getElementById('focusList');
            list.innerHTML = '';
            focuses.forEach((f, i) => {
                list.innerHTML += `<div style="padding:8px; margin:5px 0; background:#1a1a2e; border-radius:4px; cursor:pointer;" onclick="selectNodeById(${i})">${f.name}</div>`;
            });
        }

        function selectNode(node, data) {
            selectedNode = data;
            document.getElementById('editId').value = data.id;
            document.getElementById('editName').value = data.name;
            document.getElementById('editCost').value = data.cost;
            document.getElementById('editEffect').value = data.effect;
        }

        function selectNodeById(i) {
            selectNode(null, focuses[i]);
        }

        function saveNode() {
            if (!selectedNode) return;
            selectedNode.id = document.getElementById('editId').value;
            selectedNode.name = document.getElementById('editName').value;
            selectedNode.cost = document.getElementById('editCost').value;
            selectedNode.effect = document.getElementById('editEffect').value;
            renderCanvas();
        }

        function generateCode() {
            let code = 'focus_tree = {\n';
            code += '\tname = "Red_Camouflage_SOV"\n';
            code += '\tcountry = { factor = 1 }\n';
            code += '\tdefault = no\n\n';
            focuses.forEach((f, i) => {
                code += `\tfocus = {\n`;
                code += `\t\tid = ${f.id}\n`;
                code += `\t\ticon = generic_intelligence\n`;
                code += `\t\tx = 0\n\t\ty = ${i}\n\t\tcost = ${f.cost}\n`;
                code += `\t\tcompletion_reward = {\n`;
                f.effect.split('\n').forEach(e => code += `\t\t\t${e}\n`);
                code += `\t\t}\n\t}\n\n`;
            });
            code += '}';
            alert('代码已生成！点下载保存');
            window._code = code;
        }

        function downloadCode() {
            if (!window._code) generateCode();
            const blob = new Blob([window._code], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'soviet_focus_tree.txt';
            a.click();
        }

        renderCanvas();
    </script>
</body>
</html>
