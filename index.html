<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f5f1e8; color: #333; height: 100vh; overflow: hidden; }
        .topbar { background: #fff; padding: 12px 20px; display: flex; align-items: center; border-bottom: 1px solid #e0d8c8; height: 60px; }
        .topbar h1 { font-size: 18px; color: #5c3a0e; margin-right: 20px; }
        .menu-btn { display: none; background: #5c3a0e; color: white; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; margin-right: 15px; }
        .btn { background: #5c3a0e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 14px; }
        .btn.sec { background: #e0d8c8; color: #333; }
        .btn.danger { background: #e74c3c; padding: 4px 8px; font-size: 12px; }
        .page { padding: 25px; height: calc(100vh - 60px); overflow-y: auto; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat { background: #fff; padding: 20px; border-radius: 12px; }
        .stat .l { color: #999; font-size: 13px; margin-bottom: 8px; }
        .stat .v { font-size: 28px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; cursor: pointer; position: relative; }
        .card .n { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .card .t { color: #5c3a0e; font-size: 13px; margin-bottom: 12px; }
        .new { border: 2px dashed #d0c8b8; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; color: #999; cursor: pointer; }
        .editor { display: none; height: 100vh; flex-direction: column; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .side { width: 250px; background: #faf8f3; border-right: 1px solid #e0d8c8; padding: 15px 0; overflow-y: auto; flex-shrink: 0; }
        .side .item { padding: 10px 20px; cursor: pointer; color: #666; font-size: 14px; }
        .side .item.on { background: #f0ebe0; color: #5c3a0e; border-right: 3px solid #5c3a0e; font-weight: bold; }
        .side .sec { padding: 12px 20px; font-size: 11px; color: #999; margin-top: 8px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; min-width: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 12px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #e0d8c8; border-radius: 6px; background: #faf8f3; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .list-item { padding: 10px; background: #faf8f3; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #5c3a0e; gap:10px; }
        .ov { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .modal { display: none; position: fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; padding:25px; border-radius:12px; z-index:100; width:90%; max-width:500px; }
        .modal h3 { margin-bottom:15px; }
        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .side { position: fixed; top: 60px; left: 0; bottom: 0; z-index: 100; transform: translateX(-100%); width: 270px; }
            .side.open { transform: translateX(0); }
            .ov.open { display: block; }
            .stats { grid-template-columns: repeat(2,1fr); }
            .grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="home">
        <div class="topbar">
            <h1>HOI4 Mod 编辑器</h1>
        </div>
        <div class="page">
            <h2 style="margin-bottom:20px;">我的项目</h2>
            <div class="stats">
                <div class="stat"><div class="l">项目数</div><div class="v" id="statProj">1</div></div>
                <div class="stat"><div class="l">国家数</div><div class="v">1</div></div>
                <div class="stat"><div class="l">实体数</div><div class="v" id="statEnt">0</div></div>
                <div class="stat"><div class="l">存储</div><div class="v" style="font-size:16px;">浏览器本地存储</div></div>
            </div>
            <div class="grid" id="projGrid"></div>
        </div>
    </div>

    <div id="ed" class="editor">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn2">☰</button>
            <h1 id="edTitle">项目</h1>
            <button class="btn sec" id="backBtn" style="margin-left:auto;">返回首页</button>
            <button class="btn" id="exportBtn">导出mod ZIP</button>
        </div>
        <div class="ov" id="ov"></div>
        <div class="main">
            <div class="side" id="side">
                <div class="item on" data-tab="ai">AI 助手</div>
                <div class="item" data-tab="country">国家基础</div>
                <div class="sec">创作</div>
                <div class="item" data-tab="char">角色</div>
                <div class="item" data-tab="pol">政治与意识形态</div>
                <div class="item" data-tab="idea">国家精神/理念</div>
                <div class="item" data-tab="focus">国策树</div>
                <div class="item" data-tab="event">事件</div>
                <div class="item" data-tab="dec">决议</div>
                <div class="sec">系统</div>
                <div class="item" data-tab="settings">设置</div>
            </div>
            <div class="content">
                <div id="ai" class="tab">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">AI 助手</h3>
                        <div style="height:300px;overflow-y:auto;border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:10px;background:#faf8f3;" id="chatBox">
                            <div style="color:#666;">你好！我是AI助手，我能读你当前项目的所有内容，输入你的mod世界观，我帮你生成国策、事件、角色。</div>
                        </div>
                        <div style="display:flex;gap:10px;">
                            <input id="chatInput" placeholder="输入你的问题或世界观描述..." style="flex:1;">
                            <button class="btn" id="sendChatBtn">发送</button>
                        </div>
                    </div>
                </div>
                <div id="country" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">国家基础设置</h3>
                        <div class="form-row">
                            <div class="form"><label>国家3字母TAG</label><input id="ctag" value="SSF"></div>
                            <div class="form"><label>国家全名</label><input id="cname" value="苏维埃社会主义联邦"></div>
                        </div>
                        <button class="btn" id="saveCountryBtn">保存国家设置</button>
                    </div>
                </div>
                <div id="char" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加新角色</h3>
                        <div class="form"><label>角色名字</label><input id="charname" placeholder="角色名"></div>
                        <button class="btn" id="addCharBtn">+ 添加</button>
                    </div>
                    <div style="background:#fff;padding:20px;border-radius:12px;margin-top:15px;"><h3 style="margin-bottom:15px;">已添加角色</h3><div id="charlist"></div></div>
                </div>
                <div id="pol" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">政治支持率</h3>
                        <div class="form-row">
                            <div class="form"><label>共产主义%</label><input type="number" id="supcom" value="80"></div>
                            <div class="form"><label>民主主义%</label><input type="number" id="supdem" value="5"></div>
                        </div>
                        <button class="btn" id="savePolBtn">保存</button>
                    </div>
                </div>
                <div id="idea" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加国家精神</h3>
                        <div class="form"><label>名字</label><input id="ideaname" placeholder="理念名"></div>
                        <button class="btn" id="addIdeaBtn">+ 添加</button>
                    </div>
                    <div style="background:#fff;padding:20px;border-radius:12px;margin-top:15px;"><h3 style="margin-bottom:15px;">已添加理念</h3><div id="idealist"></div></div>
                </div>
                <div id="focus" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加国策</h3>
                        <div class="form"><label>国策名字</label><input id="focusname" placeholder="国策名"></div>
                        <div class="form"><label>耗时天数</label><input type="number" id="focuscost" value="70"></div>
                        <button class="btn" id="addFocusBtn">+ 添加</button>
                    </div>
                    <div style="background:#fff;padding:20px;border-radius:12px;margin-top:15px;"><h3 style="margin-bottom:15px;">已添加国策</h3><div id="focuslist"></div></div>
                </div>
                <div id="event" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加事件</h3>
                        <div class="form"><label>事件标题</label><input id="evtitle" placeholder="事件标题"></div>
                        <button class="btn" id="addEventBtn">+ 添加</button>
                    </div>
                    <div style="background:#fff;padding:20px;border-radius:12px;margin-top:15px;"><h3 style="margin-bottom:15px;">已添加事件</h3><div id="eventlist"></div></div>
                </div>
                <div id="dec" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">添加决议</h3>
                        <div class="form"><label>决议名字</label><input id="decname" placeholder="决议名"></div>
                        <button class="btn" id="addDecBtn">+ 添加</button>
                    </div>
                    <div style="background:#fff;padding:20px;border-radius:12px;margin-top:15px;"><h3 style="margin-bottom:15px;">已添加决议</h3><div id="declist"></div></div>
                </div>
                <div id="settings" class="tab" style="display:none;">
                    <div style="background:#fff;padding:20px;border-radius:12px;">
                        <h3 style="margin-bottom:15px;">设置</h3>
                        <div class="form"><label>自定义API Key（可选，填了就用你自己的DeepSeek/OpenAI兼容接口，不填用默认免费模型）</label><input id="setApiKey" type="password" placeholder="sk-..."></div>
                        <div class="form"><label>API接口地址</label><input id="setApiUrl" placeholder="https://api.deepseek.com/v1/chat/completions"></div>
                        <div class="form"><label>自定义AI系统提示词</label><textarea id="setSystemPrompt" style="height:100px;" placeholder="你是专业HOI4 mod编剧..."></textarea></div>
                        <button class="btn" id="saveSettingsBtn">保存设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="ov" id="modalOv"></div>
    <div class="modal" id="newProjModal">
        <h3>新建项目</h3>
        <div class="form"><label>模组名称</label><input id="npName" placeholder="例如 红色伪装"></div>
        <div class="form-row">
            <div class="form"><label>国家TAG（3字母）</label><input id="npTag" placeholder="SSF" maxlength="3"></div>
            <div class="form"><label>国家全名</label><input id="npCname" placeholder="苏维埃社会主义联邦"></div>
        </div>
        <div class="form"><label>简单世界观描述</label><textarea id="npDesc" placeholder="例如 1991年苏共假装解体，2024年回归..."></textarea></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px;">
            <button class="btn sec" id="npCancel">取消</button>
            <button class="btn" id="npOk">创建项目</button>
        </div>
    </div>

    <script>
        const API = 'https://hoi4-mod-editor.9dbcdc0ced2b5605508bfbd8d950042e.workers.dev';
        let projects = [];
        let cur = null;
        let settings = JSON.parse(localStorage.getItem('hoi_settings') || '{}');
        function load() {
            document.getElementById('setApiKey').value = settings.apiKey || '';
            document.getElementById('setApiUrl').value = settings.apiUrl || '';
            document.getElementById('setSystemPrompt').value = settings.systemPrompt || '';
            const s = localStorage.getItem('hoi_proj_v3');
            if (s) projects = JSON.parse(s);
            if (!projects.length) {
                projects = [{"id":"p1", "name":"红色伪装", "data":{"tag":"SSF", "cname":"苏维埃社会主义联邦", "chars":[{"name":"斯大林"}],"ideas":[{"name":"苏联重生"}],"focuses":[{"name":"翻牌联合国","cost":70}],"events":[{"title":"联合国大会"}],"decs":[]}}];
                save();
            }
            renderhome();
        }
        function save() { localStorage.setItem('hoi_proj_v3', JSON.stringify(projects)); renderhome(); }
        function renderhome() {
            document.getElementById('statProj').textContent = projects.length;
            let total = 0;
            projects.forEach(p => total += p.data.chars.length + p.data.ideas.length + p.data.focuses.length + p.data.events.length);
            document.getElementById('statEnt').textContent = total;
            const g = document.getElementById('projGrid');
            g.innerHTML = '';
            projects.forEach((p, idx) => {
                const d = document.createElement('div');
                d.className = 'card';
                d.innerHTML = '<div class="n">'+p.name+'</div><div class="t">'+p.data.tag+' - '+p.data.cname+'</div>';
                const delBtn = document.createElement('button');
                delBtn.className = 'btn danger';
                delBtn.style.cssText = 'position:absolute;top:10px;right:10px;';
                delBtn.textContent = '删除';
                delBtn.onclick = (e) => { e.stopPropagation(); if(confirm('删除项目？')) { projects.splice(idx,1); save(); } };
                d.appendChild(delBtn);
                d.onclick = () => open(p.id);
                g.appendChild(d);
            });
            const nc = document.createElement('div');
            nc.className = 'card new';
            nc.textContent = '+ 新建项目';
            nc.onclick = () => { document.getElementById('newProjModal').style.display='block'; document.getElementById('modalOv').style.display='block'; };
            g.appendChild(nc);
        }
        document.getElementById('saveSettingsBtn').onclick = () => {
            settings.apiKey = document.getElementById('setApiKey').value.trim();
            settings.apiUrl = document.getElementById('setApiUrl').value.trim();
            settings.systemPrompt = document.getElementById('setSystemPrompt').value.trim();
            localStorage.setItem('hoi_settings', JSON.stringify(settings));
            alert('设置已保存！');
        };
        document.getElementById('npCancel').onclick = () => { document.getElementById('newProjModal').style.display='none'; document.getElementById('modalOv').style.display='none'; };
        document.getElementById('npOk').onclick = () => {
            const name = document.getElementById('npName').value.trim();
            const tag = document.getElementById('npTag').value.trim().toUpperCase();
            const cname = document.getElementById('npCname').value.trim();
            if (!name || !tag) { alert('请填模组名和国家TAG'); return; }
            projects.push({id:'p'+Date.now(), name:name, data:{tag:tag, cname:cname, chars:[], ideas:[], focuses:[], events:[], decs:[]}});
            save();
            document.getElementById('newProjModal').style.display='none';
            document.getElementById('modalOv').style.display='none';
            open(projects[projects.length-1].id);
        };
        function open(id) {
            cur = projects.find(p=>p.id==id);
            document.getElementById('edTitle').textContent = cur.name;
            document.getElementById('home').style.display='none';
            document.getElementById('ed').style.display='flex';
            renderall();
        }
        document.getElementById('backBtn').onclick = () => { document.getElementById('ed').style.display='none'; document.getElementById('home').style.display='block'; save(); };
        document.getElementById('menuBtn2').onclick = () => { document.getElementById('side').classList.toggle('open'); document.getElementById('ov').classList.toggle('open'); };
        document.getElementById('ov').onclick = () => { document.getElementById('side').classList.remove('open'); document.getElementById('ov').classList.remove('open'); };
        document.querySelectorAll('.item').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.item').forEach(i=>i.classList.remove('on'));
                item.classList.add('on');
                const t = item.dataset.tab;
                document.querySelectorAll('.tab').forEach(t2=>t2.style.display='none');
                document.getElementById(t).style.display='block';
                if(innerWidth<768) { document.getElementById('side').classList.remove('open'); document.getElementById('ov').classList.remove('open'); }
            };
        });
        document.getElementById('addCharBtn').onclick = () => { const n = document.getElementById('charname').value.trim(); if(!n) return; cur.data.chars.push({name:n}); renderall(); save(); };
        document.getElementById('addIdeaBtn').onclick = () => { const n = document.getElementById('ideaname').value.trim(); if(!n) return; cur.data.ideas.push({name:n}); renderall(); save(); };
        document.getElementById('addFocusBtn').onclick = () => { const n = document.getElementById('focusname').value.trim(); const c = document.getElementById('focuscost').value; if(!n) return; cur.data.focuses.push({name:n, cost:c}); renderall(); save(); };
        document.getElementById('addEventBtn').onclick = () => { const t = document.getElementById('evtitle').value.trim(); if(!t) return; cur.data.events.push({title:t}); renderall(); save(); };
        document.getElementById('addDecBtn').onclick = () => { const n = document.getElementById('decname').value.trim(); if(!n) return; cur.data.decs.push({name:n}); renderall(); save(); };
        document.getElementById('sendChatBtn').onclick = async () => {
            const msg = document.getElementById('chatInput').value.trim();
            if (!msg) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += '<div style="margin:8px 0;color:#5c3a0e;"><b>你：</b>'+msg+'</div>';
            chatBox.innerHTML += '<div style="margin:8px 0;color:#666;">AI正在思考...</div>';
            document.getElementById('chatInput').value = '';
            try {
                if (settings.apiKey) {
                    const res = await fetch(settings.apiUrl, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey}, body:JSON.stringify({model:'deepseek-chat', messages:[{role:'system', content:settings.systemPrompt || '你是HOI4 mod内容生成器，输出JSON格式的国策、事件、角色。'},{role:'user', content:msg}], temperature:0.7})});
                    const data = await res.json();
                    chatBox.lastChild.textContent = 'AI：' + data.choices[0].message.content;
                } else {
                    const res = await fetch(API+'/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:msg})});
                    const data = await res.json();
                    chatBox.lastChild.textContent = 'AI：生成完成！已添加'+data.focuses.length+'个国策、'+data.events.length+'个事件、'+data.ideas.length+'个理念。';
                    if (data.focuses) cur.data.focuses = cur.data.focuses.concat(data.focuses);
                    if (data.events) cur.data.events = cur.data.events.concat(data.events);
                    if (data.ideas) cur.data.ideas = cur.data.ideas.concat(data.ideas);
                    renderall(); save();
                }
            } catch(e) {
                chatBox.lastChild.textContent = 'AI：生成失败，检查API设置';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        };
        document.getElementById('exportBtn').onclick = () => { alert('导出中...'); };
        function rendlist(id, arr, key) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            arr.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const info = document.createElement('div');
                info.style.flex = 1;
                info.textContent = item[key] || item.name || item.title;
                const btn = document.createElement('button');
                btn.className = 'btn danger';
                btn.textContent = '删除';
                btn.onclick = () => { arr.splice(i,1); renderall(); save(); };
                div.appendChild(info);
                div.appendChild(btn);
                el.appendChild(div);
            });
        }
        function renderall() {
            rendlist('charlist', cur.data.chars, 'name');
            rendlist('idealist', cur.data.ideas, 'name');
            rendlist('focuslist', cur.data.focuses, 'name');
            rendlist('eventlist', cur.data.events, 'title');
            rendlist('declist', cur.data.decs, 'name');
        }
        load();
    </script>
</body>
</html>
