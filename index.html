<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f5f1e8; color: #333; height: 100vh; overflow: hidden; }
        .auth-page { display:flex; align-items:center; justify-content:center; height:100vh; }
        .auth-card { background:#fff; padding:40px; border-radius:16px; width:90%; max-width:400px; }
        .auth-card h2 { text-align:center; margin-bottom:25px; color:#5c3a0e; }
        .form { margin-bottom:15px; }
        label { display:block; margin-bottom:5px; color:#666; font-size:13px; }
        input { width:100%; padding:12px; border:1px solid #e0d8c8; border-radius:8px; font-size:16px; }
        .btn { background:#5c3a0e; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; width:100%; font-size:16px; }
        .auth-switch { text-align:center; margin-top:15px; color:#666; font-size:14px; }
        .auth-switch span { color:#5c3a0e; cursor:pointer; }
        .topbar { background:#fff; padding:12px 20px; display:flex; align-items:center; border-bottom:1px solid #e0d8c8; height:64px; }
        .topbar .logo { font-size:20px; font-weight:bold; color:#5c3a0e; }
        .topbar .spacer { flex:1; }
        .btn.sec { background:#fff; color:#333; border:1px solid #e0d8c8; width:auto; padding:8px 16px; font-size:14px; }
        .page { padding:30px; height:calc(100vh - 64px); overflow-y:auto; }
        .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:30px; }
        .stat { background:#fff; padding:22px; border-radius:12px; }
        .stat .l { color:#999; font-size:13px; margin-bottom:10px; }
        .stat .v { font-size:30px; font-weight:bold; }
        .empty { text-align:center; color:#999; padding:60px 0; }
        .editor { display:none; height:100vh; flex-direction:column; }
        .main { display:flex; flex:1; overflow:hidden; }
        .side { width:240px; background:#faf8f3; border-right:1px solid #e0d8c8; padding:15px 0; overflow-y:auto; flex-shrink:0; }
        .side .sec { padding:8px 20px; font-size:11px; color:#999; margin-top:10px; }
        .side .item { padding:10px 20px; cursor:pointer; color:#666; font-size:14px; }
        .side .item.on { background:#f0ebe0; color:#5c3a0e; border-right:3px solid #5c3a0e; font-weight:bold; }
        .content { flex:1; padding:20px; overflow-y:auto; min-width:0; }
        .card { background:#fff; padding:20px; border-radius:12px; }
        .modal-mask { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:99; }
        .modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; padding:25px; border-radius:12px; z-index:100; width:90%; max-width:450px; }
        @media (max-width:768px) { .stats { grid-template-columns:repeat(2,1fr); } .side { display:none; } }
    </style>
</head>
<body>
    <div id="authPage" class="auth-page">
        <div class="auth-card">
            <h2>HOI4 Mod 编辑器</h2>
            <div id="loginForm">
                <div class="form"><label>用户名</label><input id="loginUser"></div>
                <div class="form"><label>密码</label><input type="password" id="loginPass"></div>
                <button class="btn" onclick="login()">登录</button>
                <div class="auth-switch">还没账号？<span onclick="showReg()">点这里注册</span></div>
            </div>
            <div id="regForm" style="display:none;">
                <div class="form"><label>用户名</label><input id="regUser"></div>
                <div class="form"><label>密码</label><input type="password" id="regPass"></div>
                <button class="btn" onclick="register()">注册并登录</button>
                <div class="auth-switch">已有账号？<span onclick="showLogin()">点这里登录</span></div>
            </div>
        </div>
    </div>

    <div id="home" style="display:none;">
        <div class="topbar">
            <div class="logo">HOI4 Mod 编辑器</div>
            <div class="spacer"></div>
            <span id="userName" style="margin-right:15px;color:#666;"></span>
            <button class="btn sec" onclick="logout()">退出登录</button>
            <button class="btn sec">导入已有 mod</button>
            <button class="btn" onclick="openModal()">新建空项目</button>
        </div>
        <div class="page">
            <h2 style="margin-bottom:25px;">我的项目</h2>
            <div class="stats">
                <div class="stat"><div class="l">项目</div><div class="v" id="statProj">0</div></div>
                <div class="stat"><div class="l">国家</div><div class="v">0</div></div>
                <div class="stat"><div class="l">实体</div><div class="v">0</div></div>
                <div class="stat"><div class="l">最近编辑</div><div class="v" style="font-size:18px;">无</div></div>
            </div>
            <div id="projList" class="empty">还没有项目，点右上角新建空项目开始创作</div>
        </div>
    </div>

    <div id="ed" class="editor" style="display:none;">
        <div class="topbar">
            <div class="logo" id="edTitle">未命名项目</div>
            <div class="spacer"></div>
            <button class="btn sec" onclick="gohome()">返回首页</button>
        </div>
        <div class="main">
            <div class="side">
                <div class="item on" data-tab="ai">AI 助手</div>
                <div class="sec">创作</div>
                <div class="item" data-tab="country">国家基础</div>
                <div class="item" data-tab="char">角色</div>
                <div class="item" data-tab="ideology">意识形态</div>
                <div class="item" data-tab="spirit">国家精神</div>
                <div class="item" data-tab="focus">国策树</div>
                <div class="item" data-tab="event">事件</div>
                <div class="item" data-tab="decision">决议</div>
                <div class="item" data-tab="tech">科技树</div>
                <div class="sec">地图</div>
                <div class="item" data-tab="map">地块编辑器</div>
                <div class="sec">系统</div>
                <div class="item" data-tab="loc">本地化</div>
                <div class="item" data-tab="export">导出mod</div>
                <div class="item" data-tab="settings">设置</div>
            </div>
            <div class="content">
                <div id="ai" class="tab"><div class="card"><h3>AI助手</h3></div></div>
                <div id="country" class="tab" style="display:none;"><div class="card"><h3>国家基础设置</h3></div></div>
                <div id="char" class="tab" style="display:none;"><div class="card"><h3>角色管理</h3></div></div>
                <div id="ideology" class="tab" style="display:none;"><div class="card"><h3>政治支持率</h3></div></div>
                <div id="spirit" class="tab" style="display:none;"><div class="card"><h3>国家精神</h3></div></div>
                <div id="focus" class="tab" style="display:none;"><div class="card"><h3>国策树</h3></div></div>
                <div id="event" class="tab" style="display:none;"><div class="card"><h3>事件编辑器</h3></div></div>
                <div id="decision" class="tab" style="display:none;"><div class="card"><h3>决议管理</h3></div></div>
                <div id="tech" class="tab" style="display:none;"><div class="card"><h3>科技树</h3></div></div>
                <div id="map" class="tab" style="display:none;"><div class="card"><h3>地块编辑器</h3></div></div>
                <div id="loc" class="tab" style="display:none;"><div class="card"><h3>本地化</h3></div></div>
                <div id="export" class="tab" style="display:none;"><div class="card"><h3>导出mod</h3><p style="color:#999;">导出后直接放进HOI4 mod文件夹即可游玩</p></div></div>
                <div id="settings" class="tab" style="display:none;"><div class="card"><h3>设置</h3></div></div>
            </div>
        </div>
    </div>

    <div class="modal-mask" id="modalMask" style="display:none;"></div>
    <div class="modal" id="newProjModal" style="display:none;">
        <h3 style="margin-bottom:15px;">新建空项目</h3>
        <div class="form"><label>模组名称</label><input id="npName"></div>
        <div class="form"><label>初始国家TAG（3字母）</label><input id="npTag" maxlength="3"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px;">
            <button class="btn sec" onclick="closeModal()">取消</button>
            <button class="btn" onclick="createProj()">创建</button>
        </div>
    </div>

    <script>
        let curUser = localStorage.getItem('hoi_user') || '';
        if (curUser) {
            document.getElementById('authPage').style.display='none';
            document.getElementById('home').style.display='block';
            document.getElementById('userName').textContent = curUser;
        }
        function showReg() { document.getElementById('loginForm').style.display='none'; document.getElementById('regForm').style.display='block'; }
        function showLogin() { document.getElementById('regForm').style.display='none'; document.getElementById('loginForm').style.display='block'; }
        function login() {
            const u = document.getElementById('loginUser').value;
            curUser = u;
            localStorage.setItem('hoi_user', u);
            document.getElementById('authPage').style.display='none';
            document.getElementById('home').style.display='block';
            document.getElementById('userName').textContent = u;
        }
        function register() { login(); }
        function logout() {
            localStorage.removeItem('hoi_user');
            location.reload();
        }
        function openModal() { document.getElementById('modalMask').style.display='block'; document.getElementById('newProjModal').style.display='block'; }
        function closeModal() { document.getElementById('modalMask').style.display='none'; document.getElementById('newProjModal').style.display='none'; }
        function createProj() {
            closeModal();
            document.getElementById('home').style.display='none';
            document.getElementById('ed').style.display='flex';
        }
        function gohome() { document.getElementById('ed').style.display='none'; document.getElementById('home').style.display='block'; }
        document.querySelectorAll('.item').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.item').forEach(i=>i.classList.remove('on'));
                item.classList.add('on');
                document.querySelectorAll('.tab').forEach(t2=>t2.style.display='none');
                document.getElementById(item.dataset.tab).style.display='block';
            };
        });
    </script>
</body>
</html>
