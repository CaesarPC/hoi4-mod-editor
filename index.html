<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOI4 Mod 编辑器 - 免费版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
        .toolbar { background: #16213e; padding: 10px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #0f3460; position: relative; z-index: 10; height: 50px; }
        .toolbar button { background: #0f3460; color: #eee; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .toolbar button:hover { background: #1a4a7a; }
        .toolbar button.primary { background: #38bdf8; color: #000; }
        .game-preview { width: 100vw; height: calc(100vh - 50px); background: #0d1b2a; position: relative; overflow: auto; background-image: radial-gradient(circle, #1a4a7a 1px, transparent 1px); background-size: 30px 30px; }
        .focus-node { position: absolute; width: 100px; height: 80px; background: linear-gradient(180deg, #16213e 0%, #0f3460 100%); border: 2px solid #38bdf8; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: move; padding: 5px; }
        .focus-node:hover { border-color: #7dd3fc; background: #1a4a7a; }
        .focus-node.dragging { opacity: 0.5; }
        .focus-icon { width: 40px; height: 40px; background: #38bdf8; border-radius: 4px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .focus-name { font-size: 11px; text-align: center; line-height: 1.2; }
        .editor-panel { position: fixed; right: 0; top: 50px; width: 350px; height: calc(100vh - 50px); background: #16213e; padding: 20px; border-left: 1px solid #0f3460; overflow-y: auto; display: none; z-index: 20; }
        .editor-panel.show { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #0f3460; border-radius: 4px; background: #0d1b2a; color: #eee; font-size: 13px; }
        textarea { height: 80px; resize: vertical; }
        h2 { margin-bottom: 15px; color: #38bdf8; font-size: 16px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1 style="font-size:18px; margin-right:20px; color:#38bdf8;">HOI4 Mod 编辑器</h1>
        <button class="primary" onclick="addFocus()">+ 添加国策</button>
        <button onclick="generateCode()">生成代码</button>
        <button onclick="downloadCode()">下载文件</button>
        <span style="margin-left:auto; color:#94a3b8; font-size:12px;">拖动节点调整位置，点击节点编辑</span>
    </div>
    <div class="game-preview" id="canvas">
        <div class="focus-node" style="left:100px; top:100px;" data-id="0">
            <div class="focus-icon">★</div>
            <div class="focus-name">秘密会议</div>
        </div>
    </div>
    <div class="editor-panel" id="editorPanel">
        <h2>编辑国策</h2>
        <div class="form-group">
            <label>国策名字</label>
            <input type="text" id="editName" value="秘密会议">
        </div>
        <div class="form-group">
            <label>国家Tag</label>
            <select id="editTag">
                <option value="SOV">苏联 SOV</option>
                <option value="GER">德国 GER</option>
                <option value="USA">美国 USA</option>
                <option value="CHI">中国 CHI</option>
            </select>
        </div>
        <div class="form-group">
            <label>国策ID（自动生成）</label>
            <input type="text" id="editId" readonly value="SOV_red_camouflage_1">
        </div>
        <div class="form-group">
            <label>成本（天）</label>
            <input type="number" id="editCost" value="10">
        </div>
        <div class="form-group">
            <label>添加效果（选一个点添加）</label>
            <select id="effectSelect">
                <option value="">-- 选择效果 --</option>
                <option value="political_power = 150">获得150政治点</option>
                <option value="stability_factor = 0.1">+10%稳定度</option>
                <option value="war_support = 0.1">+10%战争支持</option>
                <option value="production_speed_by_factory = 0.1">+10%军工生产速度</option>
                <option value="research_speed_factor = 0.1">+10%研究速度</option>
            </select>
            <button onclick="addEffect()" style="margin-top:5px;">添加到效果</button>
        </div>
        <div class="form-group">
            <label>效果代码</label>
            <textarea id="editEffect">political_power = 150</textarea>
        </div>
        <button onclick="saveNode()">保存修改</button>
        <button class="secondary" onclick="closeEditor()" style="background:#333;">关闭</button>
    </div>

    <script>
        let focuses = [
            { id: 'SOV_red_camouflage_1', name: '秘密会议', tag: 'SOV', cost: 10, effect: 'political_power = 150', x: 100, y: 100 }
        ];
        let selectedNode = null;
        let dragging = null;
        let offsetX, offsetY;

        function addFocus() {
            const name = prompt('国策名字：');
            if (!name) return;
            const tag = document.getElementById('editTag').value;
            const id = tag + '_' + name.replace(/\s+/g, '_').toLowerCase() + '_' + focuses.length;
            const x = 100 + focuses.length * 150;
            const y = 100 + Math.random() * 200;
            focuses.push({ id, name, tag, cost: 10, effect: '', x, y });
            renderCanvas();
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            focuses.forEach((f, i) => {
                const node = document.createElement('div');
                node.className = 'focus-node';
                node.style.left = f.x + 'px';
                node.style.top = f.y + 'px';
                node.dataset.index = i;
                node.innerHTML = `<div class="focus-icon">★</div><div class="focus-name">${f.name}</div>`;
                node.onmousedown = startDrag;
                node.ondblclick = () => editNode(f);
                canvas.appendChild(node);
            });
        }

        function startDrag(e) {
            e.preventDefault();
            const node = e.target.closest('.focus-node');
            dragging = parseInt(node.dataset.index);
            offsetX = e.clientX - focuses[dragging].x;
            offsetY = e.clientY - focuses[dragging].y;
            node.classList.add('dragging');
            document.onmousemove = drag;
            document.onmouseup = stopDrag;
        }

        function drag(e) {
            if (dragging === null) return;
            focuses[dragging].x = e.clientX - offsetX;
            focuses[dragging].y = e.clientY - offsetY;
            renderCanvas();
        }

        function stopDrag() {
            dragging = null;
            document.onmousemove = null;
            document.onmouseup = null;
        }

        function editNode(data) {
            selectedNode = data;
            document.getElementById('editName').value = data.name;
            document.getElementById('editTag').value = data.tag;
            document.getElementById('editId').value = data.id;
            document.getElementById('editCost').value = data.cost;
            document.getElementById('editEffect').value = data.effect;
            document.getElementById('editorPanel').classList.add('show');
        }

        function closeEditor() {
            document.getElementById('editorPanel').classList.remove('show');
        }

        function addEffect() {
            const effect = document.getElementById('effectSelect').value;
            if (!effect) return;
            const old = document.getElementById('editEffect').value;
            document.getElementById('editEffect').value = old + (old ? '\n' : '') + effect;
        }

        function saveNode() {
            if (!selectedNode) return;
            selectedNode.name = document.getElementById('editName').value;
            selectedNode.tag = document.getElementById('editTag').value;
            selectedNode.id = document.getElementById('editTag').value + '_' + document.getElementById('editName').value.replace(/\s+/g, '_').toLowerCase();
            selectedNode.cost = document.getElementById('editCost').value;
            selectedNode.effect = document.getElementById('editEffect').value;
            renderCanvas();
            closeEditor();
        }

        function generateCode() {
            let code = 'focus_tree = {\n';
            code += `\tname = "${focuses[0].tag}_focus_tree"\n`;
            code += '\tcountry = { factor = 1 }\n';
            code += '\tdefault = no\n\n';
            focuses.forEach((f, i) => {
                code += `\tfocus = {\n`;
                code += `\t\tid = ${f.id}\n`;
                code += `\t\ticon = generic_intelligence\n`;
                code += `\t\tx = ${Math.round(f.x / 150)}\n\t\ty = ${Math.round(f.y / 100)}\n\t\tcost = ${f.cost}\n`;
                code += `\t\tcompletion_reward = {\n`;
                f.effect.split('\n').forEach(e => code += `\t\t\t${e}\n`);
                code += `\t\t}\n\t}\n\n`;
            });
            code += '}';
            window._code = code;
            alert('代码生成完成！点下载保存');
        }

        function downloadCode() {
            if (!window._code) generateCode();
            const blob = new Blob([window._code], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'focus_tree.txt';
            a.click();
        }

        renderCanvas();
    </script>
</body>
</html>
